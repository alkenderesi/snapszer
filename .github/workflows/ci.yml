# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7  # https://github.com/marketplace/actions/checkout
      - uses: astral-sh/setup-uv@v10.0.1  # https://github.com/marketplace/actions/astral-sh-setup-uv
      - run: make setup
      - run: make lint
      - run: make test
